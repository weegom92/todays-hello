<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 안녕 - 하루의 해답과 운세</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Gowun Batang', serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            min-height: 100vh;
            color: #f3f4f6;
        }

        .book-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 min-h-screen">

    <!-- 메인 컨테이너 -->
    <div class="max-w-md w-full text-center my-8">
        <!-- 헤더 -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold tracking-widest text-amber-200 mb-2">오늘의 안녕</h1>
            <p class="text-sm text-indigo-200 font-light" style="font-family: 'Pretendard', sans-serif;">
                마음속 질문을 품고, 책을 살며시 펼쳐보세요.
            </p>
        </header>

        <!-- 해답의 책 영역 -->
        <div id="book-container" class="relative bg-amber-50/10 backdrop-blur-md border border-amber-200/20 rounded-2xl p-8 my-6 book-shadow cursor-pointer transition-all hover:scale-105 active:scale-95" onclick="openBook()">
            <div id="book-cover" class="py-12">
                <i class="fa-solid fa-book-open text-5xl text-amber-200 mb-4 animate-pulse"></i>
                <p class="text-lg text-amber-100 font-medium">손을 올려 마음을 정돈하고<br>클릭하여 페이지를 넘기세요</p>
            </div>

            <!-- 결과 표시 영역 (기본은 숨김) -->
            <div id="book-result" class="hidden fade-in py-4">
                <span id="badge" class="inline-block px-3 py-1 bg-amber-200/20 text-amber-200 rounded-full text-xs mb-4 font-sans">오늘의 해답</span>
                <p id="answer-text" class="text-xl leading-relaxed text-amber-50 font-bold mb-6">
                    "생각한 대로 흘러가지 않아도 괜찮아요. 새로운 길엔 새로운 풍경이 있으니까요."
                </p>
                
                <hr class="border-amber-200/20 my-6">

                <!-- 오늘의 운세 팁 -->
                <div class="grid grid-cols-3 gap-2 text-xs font-sans text-indigo-100">
                    <div class="bg-indigo-950/40 p-2 rounded-lg">
                        <span class="block text-amber-300 font-semibold mb-1">🎨 행운의 색</span>
                        <span id="lucky-color">따뜻한 베이지</span>
                    </div>
                    <div class="bg-indigo-950/40 p-2 rounded-lg">
                        <span class="block text-amber-300 font-semibold mb-1">☘️ 행운의 물건</span>
                        <span id="lucky-item">따뜻한 차 한 잔</span>
                    </div>
                    <div class="bg-indigo-950/40 p-2 rounded-lg">
                        <span class="block text-amber-300 font-semibold mb-1">⏰ 행운의 시간</span>
                        <span id="lucky-time">오후 3시</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 다시 뽑기 버튼 -->
        <button id="retry-btn" onclick="openBook()" class="hidden mt-4 px-6 py-2.5 bg-amber-200/20 hover:bg-amber-200/30 text-amber-100 border border-amber-200/40 rounded-full text-sm font-sans transition-all">
            <i class="fa-solid fa-rotate-right mr-2"></i>다른 질문 던지기
        </button>

        <!-- 푸터 -->
        <footer class="mt-12 text-xs text-indigo-300/60 font-sans">
            © 오늘의 안녕. 당신의 하루가 평안하기를.
        </footer>
    </div>

    <script>
        // 해답 문장 데이터베이스
        const answers = [
            "생각했던 것보다 훨씬 더 잘해내고 있어요.",
            "지금은 잠시 멈추어 숨을 고를 때입니다.",
            "망설이던 그 일을 지금 바로 시작해보세요.",
            "지나간 일에 마음을 빼앗기지 마세요. 앞날이 기다리고 있어요.",
            "당신이 들인 정성은 결코 사라지지 않습니다.",
            "뜻밖의 반가운 소식이 찾아올 거예요.",
            "오늘만큼은 나 자신에게 가장 너그러워지세요.",
            "솔직한 마음을 표현하면 복잡한 일이 쉽게 풀립니다.",
            "고민 끝에 내린 선택이 결국 옳은 길이 될 것입니다.",
            "주변을 둘러보세요. 이미 당신을 돕고 있는 사람이 있습니다.",
            "바람이 불어오는 방향으로 자연스럽게 흘러가 보세요.",
            "오늘 만나는 사람에게 따뜻한 말 한마디를 건네보세요."
        ];

        const colors = ["크림 아이보리", "포근한 딥블루", "따뜻한 차콜", "올리브 그린", "로즈 골드", "파스텔 옐로우"];
        const items = ["좋아하는 음악", "따뜻한 음료", "손편지", "작은 노트", "달콤한 초콜릿", "산책화"];
        const times = ["오전 10시", "점심 식사 직후", "오후 3시 30분", "해 질 무렵", "잠들기 1시간 전"];

        function openBook() {
            const cover = document.getElementById('book-cover');
            const result = document.getElementById('book-result');
            const retryBtn = document.getElementById('retry-btn');

            // 클릭 시 연출
            cover.classList.add('hidden');
            result.classList.remove('hidden');
            retryBtn.classList.remove('hidden');

            // 랜덤 데이터 선택
            const randomAnswer = answers[Math.floor(Math.random() * answers.length)];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomItem = items[Math.floor(Math.random() * items.length)];
            const randomTime = times[Math.floor(Math.random() * times.length)];

            // 화면에 덮어쓰기
            document.getElementById('answer-text').innerText = `"${randomAnswer}"`;
            document.getElementById('lucky-color').innerText = randomColor;
            document.getElementById('lucky-item').innerText = randomItem;
            document.getElementById('lucky-time').innerText = randomTime;
        }
    </script>
</body>
</html>
