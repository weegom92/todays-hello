<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 안녕 - 하루의 해답과 부적</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Gowun Batang', serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            color: #f3f4f6;
        }

        .book-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(251, 191, 36, 0.15);
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 min-h-screen">

    <!-- 메인 컨테이너 -->
    <div class="max-w-md w-full text-center my-6">
        
        <!-- 헤더 -->
        <header class="mb-6">
            <div class="inline-block px-3 py-1 bg-amber-400/10 border border-amber-400/30 rounded-full text-amber-300 text-xs font-sans mb-3">

            <h1 class="text-3xl font-bold tracking-widest text-amber-200 mb-2">오늘의 안녕</h1>
            <p class="text-sm text-indigo-200 font-light" style="font-family: 'Pretendard', sans-serif;">
                잠시 숨을 고르고, 마음속 질문을 품은 채 책을 펼쳐보세요.
            </p>
        </header>

        <!-- 해답의 책 카드 -->
        <div id="book-container" class="relative bg-amber-950/20 backdrop-blur-md border border-amber-300/30 rounded-2xl p-7 my-4 book-shadow transition-all">
            
            <!-- 1. 커버 (초기 화면) -->
            <div id="book-cover" class="py-12 cursor-pointer transition-transform hover:scale-105 active:scale-95" onclick="openBook()">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-amber-400/10 border border-amber-300/40 flex items-center justify-center">
                    <i class="fa-solid fa-book-open text-2xl text-amber-200 animate-pulse"></i>
                </div>
                <h2 class="text-lg text-amber-100 font-bold mb-2">오늘의 해답 펼치기</h2>
                <p class="text-xs text-indigo-200 font-sans leading-relaxed">
                    마음을 가만히 정돈하고<br>이곳을 터치해 해답을 만나보세요.
                </p>
            </div>

            <!-- 2. 결과 화면 (처음엔 숨김) -->
            <div id="book-result" class="hidden fade-in py-2">
                <span class="inline-block px-3 py-1 bg-amber-300/20 text-amber-200 rounded-full text-xs mb-4 font-sans border border-amber-300/30">
                    📜 오늘 당신을 위한 메시지
                </span>
                
                <p id="answer-text" class="text-xl leading-relaxed text-amber-50 font-bold my-4 min-h-[90px] flex items-center justify-center">
                    <!-- 해답 텍스트 출력 위치 -->
                </p>
                
                <hr class="border-amber-300/20 my-5">

                <!-- 행운 팁 -->
                <div class="grid grid-cols-3 gap-2 text-xs font-sans text-indigo-100 mb-4">
                    <div class="bg-indigo-950/60 border border-indigo-400/20 p-2.5 rounded-xl flex flex-col justify-between">
                        <span class="block text-amber-300 font-semibold mb-1">🎨 행운의 색</span>
                        <span id="lucky-color" class="font-medium text-amber-100"></span>
                    </div>
                    <div class="bg-indigo-950/60 border border-indigo-400/20 p-2.5 rounded-xl flex flex-col justify-between">
                        <span class="block text-amber-300 font-semibold mb-1">☘️ 행운의 아이템</span>
                        <span id="lucky-item" class="font-medium text-amber-100"></span>
                    </div>
                    <div class="bg-indigo-950/60 border border-indigo-400/20 p-2.5 rounded-xl flex flex-col justify-between">
                        <span class="block text-amber-300 font-semibold mb-1">⏰ 행운의 시각</span>
                        <span id="lucky-time" class="font-medium text-amber-100"></span>
                    </div>
                </div>

                <!-- 오늘의 작은 실천 섹션 -->
                <div class="bg-amber-400/10 border border-amber-300/30 p-3.5 rounded-xl text-xs font-sans text-amber-100 text-left">
                    <div class="flex items-center gap-1.5 text-amber-300 font-semibold mb-1">
                        <i class="fa-solid fa-[#57b9ff] fa-seedling text-amber-300"></i>
                        <span>오늘의 작은 실천</span>
                    </div>
                    <p id="small-action" class="text-amber-50 leading-relaxed font-normal">
                        <!-- 실천 항목 출력 위치 -->
                    </p>
                </div>

            </div>

        </div>

        <!-- 다시 질문하기 버튼 (초기엔 숨김) -->
        <button id="retry-btn" onclick="resetBook()" class="hidden mt-4 px-6 py-2.5 bg-amber-300/20 hover:bg-amber-300/30 text-amber-100 border border-amber-300/40 rounded-full text-sm font-sans transition-all active:scale-95">
            <i class="fa-solid fa-rotate-left mr-2"></i>처음으로 돌아가기

            🌙 당신의 일상 속 모든 순간에 안녕이 함께하기를.
        </footer>
    </div>
